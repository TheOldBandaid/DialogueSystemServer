services:
  server:
    build: .
    ports:
      - "127.0.0.1:${DIALOGUE_PORT:-5189}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      DialogueSystem__AdminPassword: ${DIALOGUE_ADMIN_PASSWORD:?Задайте DIALOGUE_ADMIN_PASSWORD в .env}
      DialogueSystem__EditorPassword: ${DIALOGUE_EDITOR_PASSWORD:?Задайте DIALOGUE_EDITOR_PASSWORD в .env}
    volumes:
      - dialogue-data:/data

volumes:
  dialogue-data:
